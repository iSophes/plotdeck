[project]
name = "cue-plotter-app"
version = "0.1.0"
description = "App that lets you load tracks in and plot cues simply."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyside6>=6.11.0",
    "python-vlc>=3.0.21203",
    "qt-material>=2.17"
]
authors = [
    {name = "Sophie B", email = "contact@isophes.com"}
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.10",
    "pyinstaller>=6.19.0",
]

